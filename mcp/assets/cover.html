<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  :root{ --bg:#0b0d10; --ink:#e8ecf1; --muted:#8b95a3; --brand:#3ddc97; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:900px;height:383px}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:44px 52px; position:relative; overflow:hidden;
  }
  /* 站点首页那种细网格，压得很淡 */
  body::before{
    content:""; position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(#ffffff0a 1px,transparent 1px),
                     linear-gradient(90deg,#ffffff0a 1px,transparent 1px);
    background-size:44px 44px;
  }
  .row{display:flex;align-items:center;gap:12px;position:relative}
  .dot{width:9px;height:9px;background:var(--brand);flex:none}
  .brand{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .brand .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .kicker{
    margin-left:auto; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px; letter-spacing:.14em; color:var(--brand); text-transform:uppercase;
  }
  h1{
    position:relative; font-size:40px; line-height:1.32; font-weight:700;
    letter-spacing:-.015em; max-height:3.96em; overflow:hidden;
  }
  h1.long{font-size:33px}
  h1.xlong{font-size:28px}
  .foot{
    position:relative; display:flex; align-items:baseline; gap:14px;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:13px; color:var(--muted);
    border-top:1px solid #ffffff14; padding-top:16px;
  }
  .foot .series{color:var(--brand)}
  .foot .domain{margin-left:auto}
</style></head><body>
  <div class="row">
    <span class="dot"></span>
    <span class="brand">网虫<span class="mono">Spider</span></span>
    <span class="kicker" id="kicker"></span>
  </div>
  <h1 id="title"></h1>
  <div class="foot">
    <span class="series" id="series"></span>
    <span class="domain">sourcecode.school</span>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const t = q.get('title') || '';
  const el = document.getElementById('title');
  el.textContent = t;
  // 标题越长字号越小，保证三行内放得下
  if (t.length > 46) el.className = 'xlong';
  else if (t.length > 26) el.className = 'long';
  document.getElementById('kicker').textContent = q.get('kicker') || '';
  const s = q.get('series');
  document.getElementById('series').textContent = s ? '系列 · ' + s : '';
</script>
</body></html>
